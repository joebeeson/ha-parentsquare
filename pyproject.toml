[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ha-parentsquare"
version = "0.1.0"
description = "Home Assistant integration for ParentSquare"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["parentsquare-client @ git+https://github.com/joebeeson/parentsquare-client.git@v0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/parentsquare"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q"
