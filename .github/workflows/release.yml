name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: >-
          uv run --no-project
          --with homeassistant==2026.10.2
          --with "parentsquare-client @ git+https://github.com/joebeeson/parentsquare-client.git@v0.2.4"
          --with pytest
          pytest tests
      - run: uv run --extra dev ruff check custom_components tests
      - run: uv run --extra dev ruff format --check custom_components tests
      - name: Package HACS artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          zip -r "dist/ha-parentsquare-${TAG}.zip" custom_components/parentsquare hacs.json README.md LICENSE
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi


