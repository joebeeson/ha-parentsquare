name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: >-
          uv run --no-project
          --with homeassistant==2026.10.2
          --with "parentsquare-client @ git+https://github.com/joebeeson/parentsquare-client.git@v0.1.1"
          --with pytest
          pytest tests
      - run: uv run --extra dev ruff check custom_components tests
      - run: uv run --extra dev ruff format --check custom_components tests
      - name: Package HACS artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          zip -r "dist/ha-parentsquare-${TAG}.zip" custom_components/parentsquare hacs.json README.md LICENSE
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
