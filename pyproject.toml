[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ha-parentsquare"
version = "0.4.0"
description = "Home Assistant integration for ParentSquare"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["parentsquare-client @ git+https://github.com/joebeeson/parentsquare-client.git@v0.2.3"]

[project.optional-dependencies]
dev = [
  "homeassistant==2026.10.2; python_full_version >= '3.14.2'",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "pytest-datadir>=1,<2",
  "pyrefly>=1.4,<2",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/parentsquare"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.pyrefly]
project-excludes = []
disable-project-excludes-heuristics = true
replace-imports-with-any = ["parentsquare"]
search-path = ["custom_components"]
project-includes = [
    "custom_components/parentsquare/**/*.py",
]
